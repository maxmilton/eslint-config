"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
linker = "isolated"
hoistPattern = ["@typescript-eslint/parser"] # no surprise phantom dependencies
peer = false
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = ["@maxmilton/*"]
publicHoistPattern = ["@eslint/*"]

[test]
root = "./test"
